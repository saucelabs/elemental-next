<!doctype html>
<!-- Template of the social cards (the link preview image of each page). scripts/social-cards.mjs fills it in. -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <style>
        @font-face {
            font-family: 'Fraunces';
            src: url('{{root}}/node_modules/@fontsource-variable/fraunces/files/fraunces-latin-wght-normal.woff2');
            font-weight: 100 900;
        }

        @font-face {
            font-family: 'Atkinson Hyperlegible Next';
            src: url('{{root}}/node_modules/@fontsource-variable/atkinson-hyperlegible-next/files/atkinson-hyperlegible-next-latin-wght-normal.woff2');
            font-weight: 200 800;
        }

        @font-face {
            font-family: 'Atkinson Hyperlegible Mono';
            src: url('{{root}}/node_modules/@fontsource-variable/atkinson-hyperlegible-mono/files/atkinson-hyperlegible-mono-latin-wght-normal.woff2');
            font-weight: 200 800;
        }

        :root {
            --sauce-pine: #192319;
            --sauce-highlight: #abe082;
            --sauce-ivory: #f0f0ec;
        }

        * {
            margin: 0;
            box-sizing: border-box;
        }

        body {
            width: 1200px;
            height: 675px;
            overflow: hidden;
            font-family: 'Atkinson Hyperlegible Next', sans-serif;
        }

        .card {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            padding: 64px 72px;
            color: var(--sauce-ivory);
            background:
                url('{{root}}/static/img/backgrounds/pixels-hero-dark.svg') no-repeat right -40px bottom -70px / 560px auto,
                linear-gradient(rgba(25, 35, 25, 0), rgba(171, 224, 130, 0.1) 60%, rgba(25, 35, 25, 0)),
                var(--sauce-pine);
        }

        .top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            height: 34px;
            width: auto;
        }

        .powered {
            font-family: 'Atkinson Hyperlegible Mono', monospace;
            font-size: 22px;
            letter-spacing: 0.04em;
            color: rgba(240, 240, 236, 0.75);
        }

        .powered b {
            color: var(--sauce-ivory);
        }

        .label {
            margin-top: auto;
            font-family: 'Atkinson Hyperlegible Mono', monospace;
            font-size: 24px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--sauce-highlight);
        }

        h1 {
            max-width: 820px;
            margin-top: 16px;
            font-family: 'Fraunces', serif;
            font-weight: 600;
            font-size: 76px;
            line-height: 1.05;
            letter-spacing: -0.02em;
            text-wrap: balance;
        }

        h1 em {
            font-style: normal;
            color: var(--sauce-highlight);
        }

        .tools {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 40px;
        }

        .tools:empty {
            display: none;
        }

        .tools span {
            padding: 8px 16px;
            border-radius: 999px;
            font-family: 'Atkinson Hyperlegible Mono', monospace;
            font-size: 22px;
            color: var(--sauce-pine);
            background: var(--sauce-highlight);
        }
    </style>
</head>
<body>
<div class="card">
    <div class="top">
        <img class="brand" src="{{root}}/static/img/banner-dark.svg" alt="Elemental Selenium">
        <span class="powered">Powered by <b>Sauce Labs</b></span>
    </div>
    <div class="label">{{label}}</div>
    <h1>{{title}}</h1>
    <div class="tools">{{tools}}</div>
</div>
</body>
</html>
