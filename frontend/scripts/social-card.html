<!doctype html>
<!-- Template of the social cards (the link preview image of each page). scripts/social-cards.mjs fills it in. -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <style>
        /* The fonts of the Sauce Labs brand, the same ones as the site */
        @font-face {
            font-family: 'P22 Mackinac Pro';
            src: url('{{root}}/static/fonts/Mackinac-Book.otf') format('opentype');
            font-weight: 300 400;
        }

        @font-face {
            font-family: 'Atkinson Hyperlegible Next';
            src: url('{{root}}/node_modules/@fontsource-variable/atkinson-hyperlegible-next/files/atkinson-hyperlegible-next-latin-wght-normal.woff2');
            font-weight: 200 800;
        }

        @font-face {
            font-family: 'Atkinson Hyperlegible Mono';
            src: url('{{root}}/node_modules/@fontsource-variable/atkinson-hyperlegible-mono/files/atkinson-hyperlegible-mono-latin-wght-normal.woff2');
            font-weight: 200 800;
        }

        :root {
            --sl-pine: #192319;
            --sl-khaki: #abad6c;
            --sl-highlight: #abe082;
            --sl-ivory: #f0f0ec;
            --line-on-inverse: rgba(240, 240, 236, 0.24);
        }

        * {
            margin: 0;
            box-sizing: border-box;
        }

        body {
            width: 1200px;
            height: 675px;
            overflow: hidden;
            padding: 20px;
            font-family: 'Atkinson Hyperlegible Next', sans-serif;
            background: var(--sl-ivory);
            -webkit-font-smoothing: antialiased;
        }

        /* A Pine plate with rounded corners, like the hero of the site */
        .card {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            padding: 56px 68px 60px;
            border-radius: 48px;
            color: var(--sl-ivory);
            background: var(--sl-pine);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 22px;
        }

        .brand img {
            height: 34px;
            width: auto;
        }

        .brand span {
            padding-left: 22px;
            border-left: 1px solid var(--line-on-inverse);
            font-family: 'P22 Mackinac Pro', serif;
            font-size: 34px;
            line-height: 40px;
            letter-spacing: -0.03em;
        }

        .label {
            margin-top: auto;
            font-family: 'Atkinson Hyperlegible Mono', monospace;
            font-weight: 500;
            font-size: 24px;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            color: var(--sl-khaki);
        }

        h1 {
            max-width: 940px;
            margin-top: 20px;
            font-family: 'P22 Mackinac Pro', serif;
            font-weight: 400;
            font-size: 84px;
            line-height: 0.95;
            letter-spacing: -0.04em;
            text-wrap: balance;
        }

        h1 em {
            font-style: normal;
            color: var(--sl-highlight);
        }

        .tools {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 44px;
        }

        .tools:empty {
            display: none;
        }

        .tools span {
            padding: 9px 18px;
            border: 1.5px solid var(--line-on-inverse);
            border-radius: 999px;
            font-family: 'Atkinson Hyperlegible Mono', monospace;
            font-size: 22px;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            color: var(--sl-ivory);
        }

        .tools span:first-child {
            border-color: var(--sl-highlight);
            background: var(--sl-highlight);
            color: var(--sl-pine);
        }
    </style>
</head>
<body>
<div class="card">
    <div class="brand">
        <img src="{{root}}/static/img/sauce/sauce-lockup-white.svg" alt="Sauce Labs">
        <span>Elemental Selenium</span>
    </div>
    <div class="label">{{label}}</div>
    <h1>{{title}}</h1>
    <div class="tools">{{tools}}</div>
</div>
</body>
</html>
