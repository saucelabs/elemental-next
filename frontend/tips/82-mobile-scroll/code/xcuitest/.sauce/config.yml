apiVersion: v1alpha
kind: xcuitest
sauce:
  region: us-west-1
  concurrency: 1
  metadata:
    build: Elemental Selenium - Tip 82 - XCUITest
xcuitest:
  app: https://github.com/saucelabs/my-demo-app-ios/releases/download/2.3.0/SauceLabs-Demo-App.ipa
  testApp: build/Build/Products/Debug-iphoneos/ScrollUITests-Runner.app
suites:
  - name: Scroll
    devices:
      - name: iPhone.*
artifacts:
  download:
    when: always
    match:
      - junit.xml
    directory: ./artifacts/
