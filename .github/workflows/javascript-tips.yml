name: Run JavaScript tips

on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '**/code/javascript/**'
      - '.github/workflows/javascript-tips.yml'
      - '.github/workflows/run-tips.yml'
      - '.github/scripts/**'
  push:
    branches:
      - main
    paths:
      - '**/code/javascript/**'
      - '.github/workflows/javascript-tips.yml'
      - '.github/workflows/run-tips.yml'
      - '.github/scripts/**'

jobs:
  run_tips:
    uses: ./.github/workflows/run-tips.yml
    secrets: inherit
    with:
      language: javascript
      workflow-file: javascript-tips.yml
