name: Run Java tips

on:
  schedule:
    - cron: '40 22 * * *'
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '**/code/java/**'
      - '.github/workflows/java-tips.yml'
      - '.github/workflows/run-tips.yml'
      - '.github/scripts/**'
  push:
    branches:
      - main
    paths:
      - '**/code/java/**'
      - '.github/workflows/java-tips.yml'
      - '.github/workflows/run-tips.yml'
      - '.github/scripts/**'

jobs:
  run_tips:
    uses: ./.github/workflows/run-tips.yml
    with:
      language: java
      workflow-file: java-tips.yml
