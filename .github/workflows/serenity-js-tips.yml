name: Run Serenity/JS tips

on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '**/code/serenity-js/**'
      - '.github/workflows/serenity-js-tips.yml'
      - '.github/workflows/run-tips.yml'
      - '.github/scripts/**'
  push:
    branches:
      - main
    paths:
      - '**/code/serenity-js/**'
      - '.github/workflows/serenity-js-tips.yml'
      - '.github/workflows/run-tips.yml'
      - '.github/scripts/**'

jobs:
  run_tips:
    uses: ./.github/workflows/run-tips.yml
    with:
      language: serenity-js
      workflow-file: serenity-js-tips.yml
