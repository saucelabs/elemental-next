name: Run Ruby tips

on:
  schedule:
    - cron: '55 22 * * *'
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '**/code/ruby/**'
      - '.github/workflows/ruby-tips.yml'
      - '.github/workflows/run-tips.yml'
      - '.github/scripts/**'
  push:
    branches:
      - main
    paths:
      - '**/code/ruby/**'
      - '.github/workflows/ruby-tips.yml'
      - '.github/workflows/run-tips.yml'
      - '.github/scripts/**'

jobs:
  run_tips:
    uses: ./.github/workflows/run-tips.yml
    secrets: inherit
    with:
      language: ruby
      workflow-file: ruby-tips.yml
