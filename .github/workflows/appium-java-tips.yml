name: Run Appium Java tips

# The tests run on Sauce Labs real devices, so one runner is enough
on:
  schedule:
    - cron: '10 21 * * *'
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '**/code/appium-java/**'
      - '.github/workflows/appium-java-tips.yml'
      - '.github/workflows/run-tips.yml'
      - '.github/scripts/**'
  push:
    branches:
      - main
    paths:
      - '**/code/appium-java/**'
      - '.github/workflows/appium-java-tips.yml'
      - '.github/workflows/run-tips.yml'
      - '.github/scripts/**'

jobs:
  run_tips:
    uses: ./.github/workflows/run-tips.yml
    secrets: inherit
    with:
      language: appium-java
      workflow-file: appium-java-tips.yml
      os: '["ubuntu-latest"]'
