name: Run Selenide tips

on:
  schedule:
    - cron: '40 21 * * *'
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '**/code/selenide/**'
      - '.github/workflows/selenide-tips.yml'
      - '.github/workflows/run-tips.yml'
      - '.github/scripts/**'
  push:
    branches:
      - main
    paths:
      - '**/code/selenide/**'
      - '.github/workflows/selenide-tips.yml'
      - '.github/workflows/run-tips.yml'
      - '.github/scripts/**'

jobs:
  run_tips:
    uses: ./.github/workflows/run-tips.yml
    with:
      language: selenide
      workflow-file: selenide-tips.yml
