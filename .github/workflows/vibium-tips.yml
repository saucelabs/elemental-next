name: Run Vibium tips

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '**/code/vibium/**'
      - '.github/workflows/vibium-tips.yml'
      - '.github/workflows/run-tips.yml'
      - '.github/scripts/**'
  push:
    branches:
      - main
    paths:
      - '**/code/vibium/**'
      - '.github/workflows/vibium-tips.yml'
      - '.github/workflows/run-tips.yml'
      - '.github/scripts/**'

jobs:
  run_tips:
    uses: ./.github/workflows/run-tips.yml
    secrets: inherit
    with:
      language: vibium
      workflow-file: vibium-tips.yml
