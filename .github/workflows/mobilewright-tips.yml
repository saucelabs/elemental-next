name: Run Mobilewright tips

# The tests run on Sauce Labs real devices, so one runner is enough
on:
  schedule:
    - cron: '25 21 * * *'
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '**/code/mobilewright/**'
      - '.github/workflows/mobilewright-tips.yml'
      - '.github/workflows/run-tips.yml'
      - '.github/scripts/**'
  push:
    branches:
      - main
    paths:
      - '**/code/mobilewright/**'
      - '.github/workflows/mobilewright-tips.yml'
      - '.github/workflows/run-tips.yml'
      - '.github/scripts/**'

jobs:
  run_tips:
    uses: ./.github/workflows/run-tips.yml
    secrets: inherit
    with:
      language: mobilewright
      os: '["ubuntu-latest"]'
