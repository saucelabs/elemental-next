name: Run Appium Python tips

# The tests run on Sauce Labs real devices, so one runner is enough
on:
  schedule:
    - cron: '15 21 * * *'
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '**/code/appium-python/**'
      - '.github/workflows/appium-python-tips.yml'
      - '.github/workflows/run-tips.yml'
      - '.github/scripts/**'
  push:
    branches:
      - main
    paths:
      - '**/code/appium-python/**'
      - '.github/workflows/appium-python-tips.yml'
      - '.github/workflows/run-tips.yml'
      - '.github/scripts/**'

jobs:
  run_tips:
    uses: ./.github/workflows/run-tips.yml
    secrets: inherit
    with:
      language: appium-python
      os: '["ubuntu-latest"]'
