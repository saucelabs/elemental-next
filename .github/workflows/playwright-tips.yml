name: Run Playwright tips

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '**/code/playwright/**'
      - '.github/workflows/playwright-tips.yml'
      - '.github/workflows/run-tips.yml'
      - '.github/scripts/**'
  push:
    branches:
      - main
    paths:
      - '**/code/playwright/**'
      - '.github/workflows/playwright-tips.yml'
      - '.github/workflows/run-tips.yml'
      - '.github/scripts/**'

jobs:
  run_tips:
    uses: ./.github/workflows/run-tips.yml
    secrets: inherit
    with:
      language: playwright
      workflow-file: playwright-tips.yml
